<section class="resume-section d-flex flex-column p-3 p-lg-5" id="services">
    <div class="my-auto" id="services-content">
        <h2 class="mb-5">{{ i18n "services" }}</h2>
        {{ range $.Data.services }}
            <div class="resume-item d-flex flex-column flex-md-row mb-3">
              <div class="resume-content mr-auto">
                <h3 class="mb-0">{{ .title }}</h3>
                <p>{{ .description | markdownify }}</p>
              </div>
            </div>
        {{ end }}
    </div>
</section>
